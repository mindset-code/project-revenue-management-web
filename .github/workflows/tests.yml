name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Pruebas del simulador
        # Sin argumento a proposito: `node --test tests/` funciona en Node 20
        # y en Node 22 falla con "Cannot find module .../tests". Sin
        # argumento descubre **/*.test.mjs en las dos versiones.
        run: node --test
